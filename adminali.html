<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ایڈمن پینل - نئی پروڈکٹ شامل کریں</title>
  <!-- Firebase SDK Links -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    body { background-color: #f8fafc; color: #0f172a; padding: 14px; font-family: sans-serif; }
    .admin-card { background: #ffffff; border: 2px solid #2563eb; border-radius: 12px; padding: 16px; max-width: 500px; margin: 0 auto 20px auto; }
    .admin-card h2 { font-size: 16px; color: #2563eb; margin-bottom: 12px; text-align: center; }
    .form-group { margin-bottom: 12px; text-align: right; }
    .form-group label { font-size: 12px; font-weight: bold; color: #475569; display: block; margin-bottom: 4px; }
    
    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      background-color: #ffffff;
      color: #000000;
    }
    
    .file-input-box {
      border: 2px dashed #2563eb; background: #eff6ff; padding: 14px; text-align: center; border-radius: 8px; cursor: pointer;
    }
    .file-input-box input[type="file"] { display: none; }
    
    .preview-container {
      display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 4px; justify-content: center; flex-wrap: wrap;
    }
    .preview-img { width: 65px; height: 65px; object-fit: cover; border-radius: 6px; border: 1px solid #2563eb; }

    .add-btn { width: 100%; background: #2563eb; color: #fff; border: none; padding: 14px; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 15px; margin-top: 10px; }

    .items-list-box { max-width: 500px; margin: 0 auto; }
    .item-row { background: #fff; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .item-title { font-size: 12px; font-weight: bold; color: #1e293b; }
    .del-btn { background: #ef4444; color: white; border: none; padding: 6px 10px; font-size: 11px; border-radius: 6px; cursor: pointer; }
    #loader { font-size: 12px; color: #2563eb; font-weight: bold; text-align: center; display: none; margin-top: 6px; }
  </style>
</head>
<body>

  <div class="admin-card">
    <h2>⚡ ایڈمن اپلوڈ پینل (AliExpress)</h2>
    
    <div class="form-group">
      <label>علی ایکسپریس کا کاپی شدہ متن پیسٹ کریں:</label>
      <textarea id="smartPastedText" rows="3" placeholder="متن یا لنک یہاں پیسٹ کریں..." oninput="autoParseText()"></textarea>
    </div>

    <div class="form-group">
      <label>پروڈکٹ کا عنوان (Title):</label>
      <input type="text" id="pTitle" placeholder="عنوان...">
    </div>

    <div class="form-group">
      <label>تفصیل/ڈسکرپشن (Description):</label>
      <textarea id="pDesc" rows="2" placeholder="پروڈکٹ کی کچھ تفصیل درج کریں..."></textarea>
    </div>

    <div class="form-group">
      <label>قیمت (Price):</label>
      <input type="text" id="pPrice" placeholder="SAR 0.00">
    </div>

    <div class="form-group">
      <label>افیلی ایٹ لنک (Affiliate Link):</label>
      <input type="text" id="pLink" placeholder="https://..." dir="ltr">
    </div>

    <div class="form-group">
      <label>گیلری سے (3 یا 4) تصاویر منتخب کریں:</label>
      <div class="file-input-box" onclick="document.getElementById('imgFileInput').click()">
        <span id="fileStatusText">📁 گیلری سے تصاویر منتخب کرنے کے لیے یہاں کلک کریں</span>
        <input type="file" id="imgFileInput" accept="image/*" multiple onchange="previewSelectedImages(event)">
        <div id="previewContainer" class="preview-container"></div>
      </div>
    </div>

    <div id="loader">تصاویر اپلوڈ ہو رہی ہیں، براہ کرم انتظار کریں... ⏳</div>

    <button class="add-btn" onclick="addNewProduct()">پروڈکٹ شائع کریں 🚀</button>
  </div>

  <div class="items-list-box" id="adminItemsList"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDp--gVk61VaLCK-4yygwN8Oj9CpDIp05E",
      authDomain: "kist-65357.firebaseapp.com",
      projectId: "kist-65357",
      storageBucket: "kist-65357.firebasestorage.app",
      messagingSenderId: "200844711272",
      appId: "1:200844711272:web:d980a03c9fae8b8d7972dd",
      measurementId: "G-LCZ8N3GKTE",
      databaseURL: "https://kist-65357-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("products");

    const IMGBB_API_KEY = "66dcdf21e30733bfd85545d9fb5e76c4";
    let selectedFiles = [];

    window.onload = function() {
      renderAdminList();
    };

    function autoParseText() {
      const raw = document.getElementById('smartPastedText').value;
      if (!raw) return;

      const urlMatch = raw.match(/(https?:\/\/[^\s]+)/g);
      if (urlMatch) document.getElementById('pLink').value = urlMatch[0];

      const priceMatch = raw.match(/(SAR\s?[\d\.]+)/i) || raw.match(/(SAR\s?[\d,]+)/i);
      if (priceMatch) document.getElementById('pPrice').value = priceMatch[0];

      let cleanTitle = raw.replace(/(https?:\/\/[^\s]+)/g, '').replace(/Price Now:?/i, '').replace(/SAR\s?[\d\.]+/g, '').replace(/Click & Buy:?/i, '').trim();
      if (cleanTitle) document.getElementById('pTitle').value = cleanTitle.substring(0, 80);
    }

    function previewSelectedImages(event) {
      const files = Array.from(event.target.files);
      const container = document.getElementById('previewContainer');
      container.innerHTML = '';
      selectedFiles = files;

      if (files.length > 0) {
        document.getElementById('fileStatusText').innerText = `${files.length} تصاویر منتخب کی گئی ہیں ✅`;
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = function(e) {
            const img = document.createElement('img');
            img.src = e.target.result;
            img.className = 'preview-img';
            container.appendChild(img);
          }
          reader.readAsDataURL(file);
        });
      }
    }

    function renderAdminList() {
      const container = document.getElementById('adminItemsList');
      db.on('value', (snapshot) => {
        const data = snapshot.val();
        if(!data) {
          container.innerHTML = '<p style="text-align:center; color:#94a3b8; font-size:12px;">کوئی پروڈکٹ موجود نہیں ہے۔</p>';
          return;
        }

        container.innerHTML = '<h3 style="font-size:13px; margin-bottom:8px;">موجودہ پروڈکٹس:</h3>';
        Object.keys(data).reverse().forEach((key) => {
          const item = data[key];
          container.innerHTML += `
            <div class="item-row">
              <span class="item-title">${item.title}</span>
              <button class="del-btn" onclick="deleteProduct('${key}')">🗑️ ڈلیٹ</button>
            </div>
          `;
        });
      });
    }

    async function addNewProduct() {
      const title = document.getElementById('pTitle').value.trim();
      const desc = document.getElementById('pDesc').value.trim();
      const price = document.getElementById('pPrice').value.trim();
      const link = document.getElementById('pLink').value.trim();
      const loader = document.getElementById('loader');

      if (!title || !link) {
        alert("براہ کرم عنوان اور افیلی ایٹ لنک درج کریں!");
        return;
      }

      let uploadedImageUrls = [];

      if (selectedFiles.length > 0) {
        loader.style.display = "block";
        
        for (let file of selectedFiles) {
          const formData = new FormData();
          formData.append("image", file);

          try {
            const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
              method: "POST",
              body: formData
            });
            const imgData = await res.json();
            if (imgData.success) {
              uploadedImageUrls.push(imgData.data.url);
            }
          } catch (e) {
            console.error("تصویر اپلوڈ کا مسئلہ:", e);
          }
        }
        loader.style.display = "none";
      }

      if (uploadedImageUrls.length === 0) {
        uploadedImageUrls.push("https://via.placeholder.com/150");
      }

      db.push({
        title: title,
        desc: desc || "",
        images: uploadedImageUrls,
        img: uploadedImageUrls[0],
        price: price || "Best Price",
        link: link,
        timestamp: Date.now()
      }).then(() => {
        document.getElementById('smartPastedText').value = '';
        document.getElementById('pTitle').value = '';
        document.getElementById('pDesc').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pLink').value = '';
        document.getElementById('imgFileInput').value = '';
        document.getElementById('previewContainer').innerHTML = '';
        document.getElementById('fileStatusText').innerText = "📁 گیلری سے تصاویر منتخب کرنے کے لیے یہاں کلک کریں";
        selectedFiles = [];

        alert("پروڈکٹ کامیابی سے شامل کر دی گئی ہے!");
      }).catch((err) => {
        alert("ڈیٹا بیس غلطی: " + err.message);
      });
    }

    function deleteProduct(key) {
      if (confirm("کیا آپ واقعی یہ پروڈکٹ ڈلیٹ کرنا چاہتے ہیں؟")) {
        db.child(key).remove();
      }
    }
  </script>
</body>
</html>
