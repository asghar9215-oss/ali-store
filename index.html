<!DOCTYPE html>
<html lang="ur" dir="rtl" id="htmlTag">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="pageTitle">سعودی بیسٹ ڈیلز & ڈسکاؤنٹس</title>
  <!-- Firebase SDK Links -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; padding: 10px; padding-bottom: 50px; }

    .lang-bar { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .lang-btn { background: #ffffff; border: 1px solid #cbd5e1; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; color: #334155; }
    .lang-btn.active { background: #e11d48; color: #ffffff; border-color: #e11d48; }

    .header { background: #e11d48; color: #ffffff; text-align: center; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 18px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2); }

    .adsterra-banner { background: #ffffff; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 8px; text-align: center; margin-bottom: 12px; min-height: 60px; display: flex; justify-content: center; align-items: center; overflow: hidden; }

    /* Mobile Responsive Grid Fix */
    .products-container { 
      display: grid; 
      grid-template-columns: repeat(2, minmax(0, 1fr)); 
      gap: 10px; 
      width: 100%;
    }
    
    .product-card { 
      background: #ffffff; 
      border-radius: 12px; 
      padding: 8px; 
      border: 1px solid #e2e8f0; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
      width: 100%;
      overflow: hidden;
    }
    
    /* Fixed Slider Carousel Styles for Mobile */
    .slider-wrapper { 
      position: relative; 
      width: 100%; 
      height: 150px; 
      border-radius: 8px; 
      overflow: hidden; 
      margin-bottom: 8px; 
      background: #f8fafc; 
    }
    .slider-track { 
      display: flex; 
      width: 100%; 
      height: 100%; 
      transition: transform 0.3s ease-in-out; 
    }
    .product-media { 
      width: 100%; 
      min-width: 100%;
      max-width: 100%;
      height: 150px; 
      object-fit: cover; 
      border-radius: 8px;
      border: none; 
      display: block;
    }
    .slide-btn { 
      position: absolute; 
      top: 50%; 
      transform: translateY(-50%); 
      background: rgba(0,0,0,0.5); 
      color: white; 
      border: none; 
      width: 24px; 
      height: 24px; 
      border-radius: 50%; 
      font-size: 11px; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      z-index: 5; 
    }
    .slide-btn.left { left: 4px; }
    .slide-btn.right { right: 4px; }

    .product-title { font-size: 11px; font-weight: bold; color: #1e293b; margin-bottom: 4px; line-height: 1.3; height: 30px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .product-desc { font-size: 10px; color: #64748b; margin-bottom: 6px; line-height: 1.2; height: 24px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .product-price { font-size: 13px; font-weight: 800; color: #e11d48; margin-bottom: 8px; }
    .buy-btn { display: block; background: #2563eb; color: #ffffff; text-decoration: none; text-align: center; padding: 8px 4px; border-radius: 6px; font-weight: bold; font-size: 11px; }

    /* Single column for small screens if needed */
    @media (max-width: 340px) {
      .products-container { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="lang-bar">
    <button class="lang-btn active" id="btnUr" onclick="switchLanguage('ur')">اردو</button>
    <button class="lang-btn" id="btnEn" onclick="switchLanguage('en')">English</button>
    <button class="lang-btn" id="btnAr" onclick="switchLanguage('ar')">العربية</button>
  </div>

  <div class="header" id="appHeader">🛍️ سعودی بیسٹ ڈیلز & ڈسکاؤنٹس</div>

  <!-- Adsterra Top Banner Place -->
  <div class="adsterra-banner" id="topAdBanner">
    <span style="color: #94a3b8; font-size: 11px;">[ Adsterra Top Banner Ad Here ]</span>
  </div>

  <div class="products-container" id="productsGrid"></div>

  <!-- Adsterra Bottom Banner Place -->
  <div class="adsterra-banner" id="bottomAdBanner" style="margin-top: 16px;">
    <span style="color: #94a3b8; font-size: 11px;">[ Adsterra Bottom Banner Ad Here ]</span>
  </div>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDp--gVk61VaLCK-4yygwN8Oj9CpDIp05E",
      authDomain: "kist-65357.firebaseapp.com",
      projectId: "kist-65357",
      storageBucket: "kist-65357.firebasestorage.app",
      messagingSenderId: "200844711272",
      appId: "1:200844711272:web:d980a03c9fae8b8d7972dd",
      measurementId: "G-LCZ8N3GKTE",
      databaseURL: "https://kist-65357-default-rtdb.firebaseio.com"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database().ref("products");

    let currentLang = 'ur';
    const sliderIndices = {};

    const translations = {
      ur: { title: "🛍️ سعودی بیسٹ ڈیلز & ڈسکاؤنٹس", buyBtn: "🛒 خریداری کریں", emptyMsg: "فی الحال کوئی پروڈکٹ موجود نہیں ہے۔", dir: "rtl" },
      en: { title: "🛍️ Saudi Best Deals & Discounts", buyBtn: "🛒 Buy Now", emptyMsg: "No products available currently.", dir: "ltr" },
      ar: { title: "🛍️ أفضل العروض والخصومات في السعودية", buyBtn: "🛒 اشتري الآن", emptyMsg: "لا توجد منتجات متاحة حالياً.", dir: "rtl" }
    };

    function switchLanguage(lang) {
      currentLang = lang;
      document.getElementById('htmlTag').setAttribute('dir', translations[lang].dir);
      document.getElementById('htmlTag').setAttribute('lang', lang);
      document.getElementById('appHeader').innerText = translations[lang].title;

      document.getElementById('btnUr').classList.remove('active');
      document.getElementById('btnEn').classList.remove('active');
      document.getElementById('btnAr').classList.remove('active');

      if (lang === 'ur') document.getElementById('btnUr').classList.add('active');
      if (lang === 'en') document.getElementById('btnEn').classList.add('active');
      if (lang === 'ar') document.getElementById('btnAr').classList.add('active');

      renderProducts();
    }

    function moveSlide(cardKey, direction, totalImages) {
      if (!sliderIndices[cardKey]) sliderIndices[cardKey] = 0;
      sliderIndices[cardKey] += direction;

      if (sliderIndices[cardKey] < 0) sliderIndices[cardKey] = totalImages - 1;
      if (sliderIndices[cardKey] >= totalImages) sliderIndices[cardKey] = 0;

      const track = document.getElementById(`track-${cardKey}`);
      if (track) {
        track.style.transform = `translateX(${sliderIndices[cardKey] * 100}%)`;
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');

      db.on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          grid.innerHTML = `<p style="text-align: center; grid-column: span 2; padding: 20px; color: #64748b;">${translations[currentLang].emptyMsg}</p>`;
          return;
        }

        grid.innerHTML = '';
        Object.keys(data).reverse().forEach((key) => {
          const item = data[key];
          const imgList = item.images && item.images.length > 0 ? item.images : [item.img || 'https://via.placeholder.com/150'];
          
          let sliderHtml = '';
          if (imgList.length > 1) {
            sliderHtml = `
              <div class="slider-wrapper">
                <button class="slide-btn right" onclick="moveSlide('${key}', 1, ${imgList.length})">❯</button>
                <div class="slider-track" id="track-${key}">
                  ${imgList.map(src => `<img src="${src}" class="product-media" onerror="this.src='https://via.placeholder.com/150'">`).join('')}
                </div>
                <button class="slide-btn left" onclick="moveSlide('${key}', -1, ${imgList.length})">❮</button>
              </div>
            `;
          } else {
            sliderHtml = `<div class="slider-wrapper"><img src="${imgList[0]}" class="product-media" onerror="this.src='https://via.placeholder.com/150'"></div>`;
          }

          grid.innerHTML += `
            <div class="product-card">
              <div>
                ${sliderHtml}
                <div class="product-title">${item.title}</div>
                ${item.desc ? `<div class="product-desc">${item.desc}</div>` : ''}
                <div class="product-price">${item.price}</div>
              </div>
              <a href="${item.link}" target="_blank" class="buy-btn">${translations[currentLang].buyBtn}</a>
            </div>
          `;
        });
      });
    }

    window.onload = renderProducts;
  </script>
</body>
</html>
