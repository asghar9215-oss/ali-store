<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سعودی بیسٹ ڈیلز & ڈسکاؤنٹس</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f1f5f9; color: #0f172a; padding: 10px; padding-bottom: 50px; }
    .header { background: #e11d48; color: #ffffff; text-align: center; padding: 14px; border-radius: 12px; font-weight: bold; font-size: 18px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2); }
    .adsterra-banner { background: #ffffff; border: 1px dashed #cbd5e1; border-radius: 10px; padding: 8px; text-align: center; margin-bottom: 12px; min-height: 60px; display: flex; justify-content: center; align-items: center; }
    .products-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .product-card { background: #ffffff; border-radius: 12px; padding: 10px; border: 1px solid #e2e8f0; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
    .product-img { width: 100%; height: 140px; object-fit: cover; border-radius: 8px; background: #f8fafc; margin-bottom: 8px; }
    .product-title { font-size: 12px; font-weight: bold; color: #1e293b; margin-bottom: 6px; line-height: 1.3; height: 32px; overflow: hidden; }
    .product-price { font-size: 14px; font-weight: 800; color: #e11d48; margin-bottom: 8px; }
    .buy-btn { display: block; background: #2563eb; color: #ffffff; text-decoration: none; text-align: center; padding: 8px 4px; border-radius: 6px; font-weight: bold; font-size: 11px; }
  </style>
</head>
<body>
  <div class="header">🛍️ سعودی بیسٹ ڈیلز & ڈسکاؤنٹس</div>
  <div class="adsterra-banner">
    <span style="color: #94a3b8; font-size: 11px;">[ Adsterra Top Banner Ad Here ]</span>
  </div>
  <div class="products-container" id="productsGrid">
    <p style="text-align: center; grid-column: span 2; padding: 20px; color: #64748b;">لوڈ ہو رہا ہے...</p>
  </div>
  <div class="adsterra-banner" style="margin-top: 16px;">
    <span style="color: #94a3b8; font-size: 11px;">[ Adsterra Bottom Banner Ad Here ]</span>
  </div>
  <script>
    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      const productsList = JSON.parse(localStorage.getItem('my_ali_products')) || [];
      if (productsList.length === 0) {
        grid.innerHTML = '<p style="text-align: center; grid-column: span 2; padding: 20px; color: #64748b;">فی الحال کوئی پروڈکٹ موجود نہیں ہے۔</p>';
        return;
      }
      grid.innerHTML = '';
      productsList.forEach((item) => {
        grid.innerHTML += `
          <div class="product-card">
            <div>
              <img src="${item.img}" class="product-img" onerror="this.src='https://via.placeholder.com/150'">
              <div class="product-title">${item.title}</div>
              <div class="product-price">${item.price}</div>
            </div>
            <a href="${item.link}" target="_blank" class="buy-btn">🛒 خریداری کریں</a>
          </div>
        `;
      });
    }
    window.onload = renderProducts;
  </script>
</body>
</html>
